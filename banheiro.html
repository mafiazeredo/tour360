<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour Virtual 360</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <style>
        :root {
            --spot-size: 40px;
            --spot-opacity: 0.85;
            --spot-default-color: #f5b301;
            --brand-card-opacity: 0.88;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #panorama {
            width: 100%;
            height: 100%;
        }

        /* OCULTA O BOX DE LOADING DURANTE TRANSIÇÕES PARA FICAR FLUIDO */
        .pnlm-load-box {
            display: none !important;
        }

        /* OVERLAY DE MARCA E LEAD GENERATION (CANTO SUPERIOR DIREITO) */
        #brand-overlay {
            position: absolute;
            top: 20px;
            right: 20px;
            left: auto;
            z-index: 95;
            background: rgba(18, 21, 27, var(--brand-card-opacity));
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 12px 14px;
            max-width: 270px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            transition: background 0.15s ease;
        }

        #brand-overlay.hidden {
            display: none !important;
        }

        .brand-header-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #brand-logo-img {
            max-width: 44px;
            max-height: 44px;
            object-fit: contain;
            border-radius: 4px;
            display: none;
        }

        .brand-text-wrap {
            overflow: hidden;
        }

        #brand-company-title {
            font-size: 13px;
            font-weight: bold;
            color: #fff;
            margin: 0;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #brand-company-subtitle {
            font-size: 11px;
            color: #94a3b8;
            margin: 2px 0 0 0;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #brand-whatsapp-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #25d366;
            color: #fff;
            text-decoration: none;
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(37, 211, 102, 0.35);
            transition: background 0.15s ease;
        }

        #brand-whatsapp-btn:hover {
            background: #20ba5a;
        }

        /* MARCADOR BASE 2D SEM TRANSITION (ZERO DELAY) */
        .pnlm-hotspot-base {
            width: var(--spot-size) !important;
            height: var(--spot-size) !important;
            margin-left: calc(var(--spot-size) / -2) !important;
            margin-top: calc(var(--spot-size) / -2) !important;
            opacity: var(--spot-opacity) !important;
            cursor: pointer !important;
            display: block !important;
            position: absolute !important;
            border-radius: 50% !important;
            background-color: var(--spot-default-color);
            border: 2px solid #ffffff !important;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.6) !important;
            transition: none !important;
            overflow: visible !important;
        }

        .pnlm-hotspot-base:hover {
            opacity: 1 !important;
            background-color: #ffffff !important;
        }

        /* SETA CENTRALIZADA ORIENTADA AO TOUR */
        .spot-arrow-center {
            position: absolute !important;
            top: 50% !important;
            left: 50% !important;
            width: calc(var(--spot-size) * 0.48) !important;
            height: calc(var(--spot-size) * 0.48) !important;
            margin-top: calc(var(--spot-size) * -0.24) !important;
            margin-left: calc(var(--spot-size) * -0.24) !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            pointer-events: none !important;
            transform-origin: center center !important;
        }

        .spot-arrow-center svg {
            width: 100% !important;
            height: 100% !important;
            fill: #ffffff !important;
            display: block !important;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.8)) !important;
        }

        .pnlm-hotspot-base:hover .spot-arrow-center svg {
            fill: var(--current-spot-color, #f5b301) !important;
        }

        .pnlm-tooltip,
        .pnlm-tooltip span {
            display: none !important;
        }

        /* CONTAINER DE TEXTO EXCLUSIVO */
        .spot-label {
            position: absolute !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            white-space: nowrap !important;
            color: #ffffff !important;
            font-size: 11px !important;
            font-weight: 600 !important;
            text-shadow: 0 1px 3px rgba(0,0,0,0.95), 0 0 6px rgba(0,0,0,0.9) !important;
            pointer-events: none !important;
            padding: 3px 8px !important;
            border-radius: 4px !important;
            background: rgba(18, 21, 27, 0.85) !important;
            border: 1px solid rgba(255, 255, 255, 0.25) !important;
            line-height: 1.2 !important;
            margin: 0 !important;
            z-index: 1000 !important;
        }

        .spot-label.pos-top {
            bottom: calc(100% + 14px) !important;
            top: auto !important;
        }

        .spot-label.pos-bottom {
            top: calc(100% + 14px) !important;
            bottom: auto !important;
        }

        /* LIGHTBOX */
        #lightbox-overlay { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.85); 
            z-index: 300; 
            align-items: center; 
            justify-content: center; 
            flex-direction: column; 
            cursor: pointer; 
        }

        #lightbox-img { 
            max-width: 85%; 
            max-height: 80%; 
            border-radius: 6px; 
            border: 2px solid #f5b301; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        #lightbox-caption { 
            margin-top: 12px; 
            font-size: 15px; 
            font-weight: 500; 
            color: #fff; 
        }
    </style>
</head>
<body>
    <div id="panorama"></div>

    <!-- OVERLAY DE MARCA E CONTATO -->
    <div id="brand-overlay" class="hidden">
        <div class="brand-header-wrap">
            <img id="brand-logo-img" src="" alt="Logo">
            <div class="brand-text-wrap">
                <div id="brand-company-title"></div>
                <div id="brand-company-subtitle"></div>
            </div>
        </div>
        <a id="brand-whatsapp-btn" href="#" target="_blank">
            <span>💬</span>
            <span id="brand-btn-label">Falar no WhatsApp</span>
        </a>
    </div>

    <div id="lightbox-overlay" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="Detalhe">
        <div id="lightbox-caption"></div>
        <span style="font-size: 11px; color: #aaa; margin-top: 6px;">(Clique em qualquer local para fechar)</span>
    </div>

    <script>
        var viewer = null;
        var isTransitioning = false;

        function openLightbox(src, caption) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox-caption').innerText = caption || '';
            document.getElementById('lightbox-overlay').style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox-overlay').style.display = 'none';
        }

        function renderBrandOverlay(b) {
            if (!b) return;
            var overlay = document.getElementById('brand-overlay');
            var titleEl = document.getElementById('brand-company-title');
            var subEl = document.getElementById('brand-company-subtitle');
            var logoEl = document.getElementById('brand-logo-img');
            var waBtn = document.getElementById('brand-whatsapp-btn');
            var btnLabel = document.getElementById('brand-btn-label');

            if (!b.title && !b.subtitle && !b.logo && !b.whatsapp) {
                overlay.classList.add('hidden');
                return;
            }

            var cardOp = (b.cardOpacity !== undefined) ? (b.cardOpacity / 100) : 0.88;
            document.documentElement.style.setProperty('--brand-card-opacity', cardOp);

            overlay.classList.remove('hidden');
            titleEl.innerText = b.title || 'Tour Virtual 360°';
            subEl.innerText = b.subtitle || '';
            subEl.style.display = b.subtitle ? 'block' : 'none';

            if (b.logo) {
                logoEl.src = b.logo;
                logoEl.style.display = 'block';
            } else {
                logoEl.style.display = 'none';
            }

            if (b.whatsapp) {
                var cleanNumber = b.whatsapp.toString().replace(/\D/g, '');
                waBtn.style.display = 'flex';
                waBtn.href = 'https://wa.me/' + cleanNumber;
                btnLabel.innerText = b.btnText || 'Falar no WhatsApp';
            } else {
                waBtn.style.display = 'none';
            }
        }

        // TRANSIÇÃO FLUIDA: AVANÇO SUAVE SEM TRANCAS OU CAIXA DE LOADING
        function executeSmoothWalk(targetSceneId, targetYaw, spotPitch, spotYaw) {
            if (isTransitioning || !viewer) return;
            isTransitioning = true;

            // 1. Gira a câmera suavemente na direção da passagem
            viewer.lookAt(spotPitch, spotYaw, viewer.getHfov(), 300);

            // 2. Carrega a próxima cena com crossfade suave mantendo o campo de visão constante
            setTimeout(function() {
                var arrivalYaw = (targetYaw !== undefined && targetYaw !== null) ? targetYaw : 0;
                viewer.loadScene(targetSceneId, 0, arrivalYaw, viewer.getHfov());
                isTransitioning = false;
            }, 250);
        }

        fetch('tour_config.json')
            .then(function(response) {
                if (!response.ok) throw new Error('Não foi possível encontrar o arquivo tour_config.json');
                return response.json();
            })
            .then(function(tourData) {
                if (tourData.default) {
                    if (tourData.default.spotSize) {
                        document.documentElement.style.setProperty('--spot-size', tourData.default.spotSize + 'px');
                    }
                    if (tourData.default.spotOpacity) {
                        document.documentElement.style.setProperty('--spot-opacity', (tourData.default.spotOpacity / 100));
                    }
                    // Dissolve contínuo e rápido
                    tourData.default.sceneFadeDuration = 500;
                }

                if (tourData.branding) {
                    renderBrandOverlay(tourData.branding);
                }

                for (var sc in tourData.scenes) {
                    tourData.scenes[sc].hotSpots.forEach(function(sp) {
                        var shapeClass = sp.shape || 'shape-arrow';
                        sp.cssClass = shapeClass;

                        sp.createTooltipFunc = function(hotSpotDiv, args) {
                            var spotColor = args.color || '#f5b301';
                            hotSpotDiv.style.backgroundColor = spotColor;
                            hotSpotDiv.style.setProperty('--current-spot-color', spotColor);

                            if (args.shape === 'shape-arrow') {
                                var arrowDiv = document.createElement('div');
                                arrowDiv.className = 'spot-arrow-center';
                                arrowDiv.style.transform = 'rotate(' + (args.rotation || 0) + 'deg)';
                                arrowDiv.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 3l8 17-8-5-8 5z"/></svg>';
                                hotSpotDiv.appendChild(arrowDiv);
                            }

                            if (args.text && args.text.trim() !== '') {
                                var labelDiv = document.createElement('div');
                                labelDiv.className = 'spot-label ' + (args.textPosition === 'bottom' ? 'pos-bottom' : 'pos-top');
                                labelDiv.innerText = args.text;
                                hotSpotDiv.appendChild(labelDiv);
                            }
                        };

                        sp.createTooltipArgs = {
                            shape: shapeClass,
                            rotation: sp.rotation || 0,
                            text: sp.text || '',
                            textPosition: sp.textPosition || 'top',
                            color: sp.color || '#f5b301'
                        };

                        if (sp.type === 'scene') {
                            var destSceneId = sp.sceneId;
                            var destTargetYaw = sp.targetYaw;
                            var sPitch = sp.pitch;
                            var sYaw = sp.yaw;

                            sp.sceneId = undefined;
                            sp.clickHandlerFunc = function() {
                                executeSmoothWalk(destSceneId, destTargetYaw, sPitch, sYaw);
                            };
                        } else if (sp.type === 'info') {
                            sp.clickHandlerFunc = (function(spot) {
                                return function() {
                                    if (spot.image) {
                                        openLightbox(spot.image, spot.text);
                                    } else if (spot.URL) {
                                        window.open(spot.URL, '_blank');
                                    }
                                };
                            })(sp);
                        }
                    });
                }

                viewer = pannellum.viewer('panorama', tourData);

                var aboutBox = document.querySelector('.pnlm-about-msg');
                if (aboutBox) {
                    aboutBox.innerHTML = '<a href="https://marcellofotografia.com.br" target="_blank" style="color:#fff; text-decoration:none;">Marcello Fotografia | Tour 360°</a>';
                }
            })
            .catch(function(err) {
                console.error(err);
                document.body.innerHTML = '<div style="color:#fff; text-align:center; padding-top:50px;">Erro ao carregar o arquivo tour_config.json. Verifique se ele foi commitado no repositório.</div>';
            });
    </script>
</body>
</html>
