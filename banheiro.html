<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour Virtual 360</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #panorama {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="panorama"></div>
    <script>
        var tourConfig = {
    "default": {
        "firstScene": "banheiro",
        "autoLoad": true,
        "sceneFadeDuration": 800
    },
    "scenes": {
        "banheiro": {
            "title": "Banheiro",
            "type": "equirectangular",
            "panorama": "banheiro.jpg",
            "hotSpots": [
                {
                    "pitch": -25.13,
                    "yaw": 35.75,
                    "type": "scene",
                    "text": "Ir para Corredor",
                    "sceneId": "corredor",
                    "targetYaw": 77,
                    "div": {}
                }
            ]
        },
        "corredor": {
            "title": "Corredor",
            "type": "equirectangular",
            "panorama": "corredor.jpg",
            "hotSpots": [
                {
                    "pitch": -47.73,
                    "yaw": -102.11,
                    "type": "scene",
                    "text": "Ir para Banheiro",
                    "sceneId": "banheiro",
                    "targetYaw": -153
                }
            ]
        }
    }
};

        pannellum.viewer('panorama', tourConfig);

        window.addEventListener('load', function() {
            var aboutBox = document.querySelector('.pnlm-about-msg');
            if (aboutBox) {
                aboutBox.innerHTML = '<a href="https://marcellofotografia.com" target="_blank" style="color:#fff; text-decoration:none;">Marcello Fotografia | Tour 360°</a>';
            }
        });
    </script>
</body>
</html>
