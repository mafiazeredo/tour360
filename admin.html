<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criador de Tour 360</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; display: flex; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #12151b; color: #fff; }
        #sidebar { width: 360px; background: #1a1e26; border-right: 1px solid #2d3442; display: flex; flex-direction: column; }
        #sidebar-header { padding: 18px; border-bottom: 1px solid #2d3442; }
        #sidebar-header h1 { font-size: 18px; margin: 0 0 6px 0; color: #f5b301; }
        #sidebar-header p { font-size: 12px; color: #8c97a8; margin: 0; }
        #sidebar-content { padding: 18px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 16px; }
        #panorama { flex: 1; height: 100%; position: relative; }
        
        .card { background: #222834; border: 1px solid #2e3748; border-radius: 8px; padding: 14px; }
        .card-title { font-size: 14px; font-weight: bold; margin-bottom: 10px; color: #e1e7f0; display: flex; align-items: center; gap: 8px; }
        .step-number { background: #f5b301; color: #000; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }
        
        select, input, button { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #3b4457; background: #14171f; color: #fff; font-size: 13px; margin-top: 6px; }
        button.primary { background: #f5b301; color: #000; font-weight: bold; border: none; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        button.primary:hover { background: #e0a200; }
        
        button.tool-btn { background: #2e3748; color: #fff; border: 1px solid #475569; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 500; }
        button.tool-btn.active { background: #10b981; border-color: #059669; color: #fff; }
        
        .photo-chip { background: #14171f; border: 1px solid #2e3748; border-radius: 6px; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; cursor: pointer; }
        .photo-chip.active { border-color: #f5b301; background: #262c3a; font-weight: bold; }
        .badge { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: #2e3748; color: #8c97a8; }
        
        #instruction-banner { position: absolute; top: 16px; left: 16px; right: 16px; background: rgba(20, 23, 31, 0.92); border: 1px solid #f5b301; padding: 12px 18px; border-radius: 8px; z-index: 100; display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(4px); }
        #instruction-banner span { font-size: 14px; font-weight: 500; }
        
        /* Modal flutuante */
        #modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.65); z-index: 200; align-items: center; justify-content: center; }
        #modal-box { background: #1a1e26; border: 1px solid #3b4457; border-radius: 10px; width: 340px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #modal-box h3 { margin: 0 0 10px 0; font-size: 16px; color: #f5b301; }
        .modal-buttons { display: flex; gap: 8px; margin-top: 14px; }
        .btn-cancel { background: #3b4457; color: #fff; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div id="sidebar">
    <div id="sidebar-header">
        <h1>Criador de Tour 360</h1>
        <p>Ambiente administrativo visual</p>
    </div>

    <div id="sidebar-content">
        <!-- Passo 1: Fotos do Tour -->
        <div class="card">
            <div class="card-title">
                <span class="step-number">1</span>
                Ambientes do Tour
            </div>
            <label style="font-size: 12px; color: #8c97a8;">Escolha fotos do repositório:</label>
            <select id="repoPhotosSelect">
                <option value="">Carregando fotos do GitHub...</option>
            </select>
            <button class="primary" onclick="addPhotoToTour()">+ Adicionar este Cômodo</button>
            
            <div style="margin-top: 14px;" id="tourScenesList"></div>
        </div>

        <!-- Passo 2: Ferramenta de Conexão -->
        <div class="card">
            <div class="card-title">
                <span class="step-number">2</span>
                Passagens / Conexões
            </div>
            <p style="font-size: 12px; color: #8c97a8; margin: 0 0 8px 0;">Para girar livremente sem marcar ponto, deixe desativado. Ative apenas quando for clicar na porta.</p>
            <button id="addPointModeBtn" class="tool-btn" onclick="toggleAddPointMode()">📍 Ativar Modo: Marcar Ponto</button>
        </div>

        <!-- Passo 3: Exportar -->
        <div class="card">
            <div class="card-title">
                <span class="step-number">3</span>
                Finalizar Tour
            </div>
            <button class="primary" onclick="generateFinalCode()">Concluir Tour</button>
            <textarea id="finalCodeArea" style="display:none; width: 100%; height: 120px; margin-top: 10px; background: #14171f; color: #00e676; border: 1px solid #2e3748; border-radius: 6px; padding: 8px; font-family: monospace; font-size: 11px;"></textarea>
        </div>
    </div>
</div>

<div id="panorama">
    <div id="instruction-banner">
        <span id="instructionText">Adicione um cômodo no menu à esquerda para iniciar.</span>
    </div>
</div>

<!-- Modal Flutuante para Conectar Ambientes -->
<div id="modal-overlay">
    <div id="modal-box">
        <h3>Criar Passagem de Ambiente</h3>
        <label style="font-size: 12px; color: #8c97a8;">Para qual cômodo essa passagem deve levar?</label>
        <select id="modalTargetScene"></select>
        
        <label style="font-size: 12px; color: #8c97a8; margin-top: 10px; display: block;">Texto da seta:</label>
        <input type="text" id="modalText" placeholder="ex: Ir para o Corredor">
        
        <div class="modal-buttons">
            <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
            <button class="primary" style="margin-top:0;" onclick="confirmHotspot()">Salvar Conexão</button>
        </div>
    </div>
</div>

<script>
    var tourData = {
        "default": { "firstScene": "", "autoLoad": true, "sceneFadeDuration": 800 },
        "scenes": {}
    };

    var viewer = null;
    var currentSceneId = "";
    var tempCoords = null;
    var addPointMode = false;
    var isDragging = false;
    var startX = 0, startY = 0;

    window.addEventListener('load', function() {
        var repoUser = "mafiazeredo";
        var repoName = "tour360";
        fetch("https://api.github.com/repos/" + repoUser + "/" + repoName + "/contents/")
            .then(function(res) { return res.json(); })
            .then(function(files) {
                var select = document.getElementById('repoPhotosSelect');
                select.innerHTML = '<option value="">-- Selecione uma foto --</option>';
                var images = files.filter(function(f) { return f.type === "file" && /\.(jpg|jpeg|png)$/i.test(f.name); });
                images.forEach(function(img) {
                    var opt = document.createElement('option');
                    opt.value = img.name;
                    opt.text = img.name;
                    select.appendChild(opt);
                });
            })
            .catch(function() {
                document.getElementById('repoPhotosSelect').innerHTML = '<option value="">Erro ao carregar lista</option>';
            });
    });

    function toggleAddPointMode() {
        if (!currentSceneId) return alert('Adicione ou selecione um cômodo primeiro!');
        addPointMode = !addPointMode;
        var btn = document.getElementById('addPointModeBtn');
        if (addPointMode) {
            btn.classList.add('active');
            btn.innerText = '✓ Modo Marcar Ativo (Clique na porta)';
            document.getElementById('instructionText').innerText = '🎯 Clique com o botão esquerdo exatamente onde quer posicionar a passagem.';
        } else {
            btn.classList.remove('active');
            btn.innerText = '📍 Ativar Modo: Marcar Ponto';
            document.getElementById('instructionText').innerText = 'Você está em "' + tourData.scenes[currentSceneId].title + '". Arraste para girar a imagem livremente.';
        }
    }

    function addPhotoToTour() {
        var filename = document.getElementById('repoPhotosSelect').value;
        if (!filename) return alert('Selecione uma foto da lista!');

        var id = filename.substring(0, filename.lastIndexOf('.')).toLowerCase();
        var title = id.charAt(0).toUpperCase() + id.slice(1);

        if (tourData.scenes[id]) return alert('Este cômodo já está no tour!');

        tourData.scenes[id] = {
            "title": title,
            "type": "equirectangular",
            "panorama": filename,
            "hotSpots": []
        };

        if (!tourData.default.firstScene) tourData.default.firstScene = id;

        renderScenesList();
        loadSceneInViewer(id);
    }

    function renderScenesList() {
        var container = document.getElementById('tourScenesList');
        container.innerHTML = '<label style="font-size:12px; color:#8c97a8; display:block; margin-bottom:6px;">Cômodos no Tour (clique para alternar):</label>';
        
        for (var id in tourData.scenes) {
            var chip = document.createElement('div');
            chip.className = 'photo-chip' + (id === currentSceneId ? ' active' : '');
            chip.innerHTML = '<span>' + tourData.scenes[id].title + '</span><span class="badge">' + tourData.scenes[id].hotSpots.length + ' passagens</span>';
            chip.onclick = (function(sceneId) {
                return function() { loadSceneInViewer(sceneId); };
            })(id);
            container.appendChild(chip);
        }
    }

    function loadSceneInViewer(sceneId) {
        currentSceneId = sceneId;
        renderScenesList();

        var container = document.getElementById('panorama');
        // Mantém apenas o banner de instrução e limpa qualquer viewer anterior
        container.innerHTML = '<div id="instruction-banner"><span id="instructionText"></span></div>';

        viewer = pannellum.viewer('panorama', {
            "default": tourData.default,
            "scenes": tourData.scenes
        });

        viewer.loadScene(sceneId);

        if (addPointMode) {
            document.getElementById('instructionText').innerText = '🎯 Clique com o botão esquerdo exatamente onde quer posicionar a passagem.';
        } else {
            document.getElementById('instructionText').innerText = 'Você está em "' + tourData.scenes[sceneId].title + '". Arraste para girar livremente.';
        }

        setupClickHandler();
    }

    function setupClickHandler() {
        var el = document.getElementById('panorama');

        el.onmousedown = function(e) {
            isDragging = false;
            startX = e.clientX;
            startY = e.clientY;
        };

        el.onmousemove = function(e) {
            if (Math.abs(e.clientX - startX) > 4 || Math.abs(e.clientY - startY) > 4) {
                isDragging = true;
            }
        };

        el.onmouseup = function(e) {
            if (!isDragging && addPointMode) {
                var coords = viewer.mouseEventToCoords(e);
                if (coords && coords.length >= 2) {
                    tempCoords = coords;
                    openModal();
                }
            }
        };
    }

    function openModal() {
        var otherScenes = Object.keys(tourData.scenes).filter(function(id) { return id !== currentSceneId; });
        if (otherScenes.length === 0) {
            alert('Adicione outro cômodo no menu para conectar a este!');
            return;
        }

        var select = document.getElementById('modalTargetScene');
        select.innerHTML = '';
        otherScenes.forEach(function(id) {
            var opt = document.createElement('option');
            opt.value = id;
            opt.text = tourData.scenes[id].title;
            select.appendChild(opt);
        });

        document.getElementById('modalText').value = 'Ir para ' + tourData.scenes[otherScenes[0]].title;
        document.getElementById('modal-overlay').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('modal-overlay').style.display = 'none';
        tempCoords = null;
    }

    function confirmHotspot() {
        var targetSceneId = document.getElementById('modalTargetScene').value;
        var text = document.getElementById('modalText').value || 'Avançar';

        tourData.scenes[currentSceneId].hotSpots.push({
            "pitch": parseFloat(tempCoords[0].toFixed(2)),
            "yaw": parseFloat(tempCoords[1].toFixed(2)),
            "type": "scene",
            "text": text,
            "sceneId": targetSceneId
        });

        closeModal();
        toggleAddPointMode(); // Desativa o modo ponto após criar
        loadSceneInViewer(currentSceneId);
    }

    function generateFinalCode() {
        var area = document.getElementById('finalCodeArea');
        area.value = JSON.stringify(tourData, null, 4);
        area.style.display = 'block';
        alert('Código final do tour gerado com sucesso!');
    }
</script>
</body>
</html>
