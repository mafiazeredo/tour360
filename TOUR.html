<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour Virtual 360</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <style>
        :root {
            --spot-size: 36px;
            --spot-opacity: 0.75;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }

        #panorama {
            width: 100%;
            height: 100%;
        }

        /* Estilo dos círculos fixos sem cards */
        .spot-circle {
            width: var(--spot-size) !important;
            height: var(--spot-size) !important;
            margin-left: calc(var(--spot-size) / -2) !important;
            margin-top: calc(var(--spot-size) / -2) !important;
            border-radius: 50% !important;
            border: 2px solid rgba(255, 255, 255, 0.95) !important;
            background: #f5b301 !important;
            opacity: var(--spot-opacity) !important;
            box-shadow: 0 0 8px rgba(0,0,0,0.6) !important;
            cursor: pointer !important;
            display: block !important;
            transition: opacity 0.15s ease, background 0.15s ease !important;
        }

        .spot-circle:hover {
            opacity: 1 !important;
            background: #ffffff !important;
        }

        .spot-circle span {
            display: none !important;
        }

        /* Lightbox de foto cheia */
        #lightbox-overlay { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.85); 
            z-index: 300; 
            align-items: center; 
            justify-content: center; 
            flex-direction: column; 
            cursor: pointer; 
        }

        #lightbox-img { 
            max-width: 85%; 
            max-height: 80%; 
            border-radius: 6px; 
            border: 2px solid #f5b301; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        #lightbox-caption { 
            margin-top: 12px; 
            font-size: 15px; 
            font-weight: 500; 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
    </style>
</head>
<body>
    <div id="panorama"></div>

    <div id="lightbox-overlay" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="Detalhe">
        <div id="lightbox-caption"></div>
        <span style="font-size: 11px; color: #aaa; margin-top: 6px; font-family: sans-serif;">(Clique em qualquer local para fechar)</span>
    </div>

    <script>
        function openLightbox(src, caption) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox-caption').innerText = caption || '';
            document.getElementById('lightbox-overlay').style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox-overlay').style.display = 'none';
        }

        // Carrega o arquivo JSON do repositório
        fetch('tour_config.json')
            .then(function(response) {
                if (!response.ok) throw new Error('Não foi possível encontrar o arquivo tour_config.json');
                return response.json();
            })
            .then(function(tourData) {
                // Aplica a classe dos círculos e ação de clique nas fotos
                for (var sc in tourData.scenes) {
                    tourData.scenes[sc].hotSpots.forEach(function(sp) {
                        sp.cssClass = 'spot-circle';
                        if (sp.type === 'info') {
                            sp.clickHandlerFunc = (function(spot) {
                                return function() {
                                    if (spot.image) {
                                        openLightbox(spot.image, spot.text);
                                    } else if (spot.URL) {
                                        window.open(spot.URL, '_blank');
                                    }
                                };
                            })(sp);
                        }
                    });
                }

                pannellum.viewer('panorama', tourData);

                var aboutBox = document.querySelector('.pnlm-about-msg');
                if (aboutBox) {
                    aboutBox.innerHTML = '<a href="https://marcellofotografia.com.br" target="_blank" style="color:#fff; text-decoration:none;">Marcello Fotografia | Tour 360°</a>';
                }
            })
            .catch(function(err) {
                console.error(err);
                document.body.innerHTML = '<div style="color:#fff; font-family:sans-serif; text-align:center; padding-top:50px;">Erro ao carregar o arquivo tour_config.json. Verifique se ele foi commitado no repositório.</div>';
            });
    </script>
</body>
</html>
